name: release

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  setup-test-build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Testing
        run: pnpm test:ci

  setup-release:

    needs: setup-test-build

    runs-on: ubuntu-latest

    # Packages are published with npm Trusted Publishing (OIDC) — no NPM_TOKEN.
    # This requires a trusted publisher (this repository + this workflow file) to be
    # configured for each package on npmjs.com. The `id-token: write` permission lets
    # the job mint the short-lived OIDC token used for authentication and to sign the
    # provenance attestations.
    permissions:
      contents: read
      id-token: write

    # A named environment records this publish as a tracked deployment, so the run
    # shows a progress bar and the deployment history on the repo's Environments tab.
    environment:
      name: npm
      url: https://www.npmjs.com/package/airhorn

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack
        run: |
          mkdir -p packed
          pnpm --filter "./packages/**" pack --pack-destination packed
          ls -la packed

      - name: Stage publish
        # pnpm ≥ 11.3. --no-git-checks: git-checks run even for a tarball and
        # fail on a detached release-tag checkout and on the untracked pack output.
        # stage publish accepts one tarball; loop so all workspace packages stage.
        run: |
          shopt -s nullglob
          tarballs=(./packed/*.tgz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "error: no packed tarballs" >&2
            exit 1
          fi
          for tgz in "${tarballs[@]}"; do
            pnpm stage publish "$tgz" --access public --provenance --no-git-checks
          done
